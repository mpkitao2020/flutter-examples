name: lunarabi

on:
  pull_request:
  push:
  workflow_dispatch:

defaults:
  run:
    working-directory: lunarabi

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos lib test
      - run: flutter test

  release-preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release inputs
        env:
          LUNARABI_WEB_BASE_URL: ${{ secrets.LUNARABI_WEB_BASE_URL }}
          LUNARABI_API_BASE_URL: ${{ secrets.LUNARABI_API_BASE_URL }}
          LUNARABI_DEEP_LINK_HOST: ${{ secrets.LUNARABI_DEEP_LINK_HOST }}
          LUNARABI_ANDROID_STORE_FILE: ${{ secrets.LUNARABI_ANDROID_STORE_FILE }}
          LUNARABI_ANDROID_STORE_PASSWORD: ${{ secrets.LUNARABI_ANDROID_STORE_PASSWORD }}
          LUNARABI_ANDROID_KEY_ALIAS: ${{ secrets.LUNARABI_ANDROID_KEY_ALIAS }}
          LUNARABI_ANDROID_KEY_PASSWORD: ${{ secrets.LUNARABI_ANDROID_KEY_PASSWORD }}
        run: bash tool/verify_release_inputs.sh
